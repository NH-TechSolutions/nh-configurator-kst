<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KST configurator</title>
<style>
:root{
  --ground:#F3F4F6;--surface:#FFFFFF;--surface-2:#EDEFF2;--surface-3:#E1E5EA;
  --ink:#1B2430;--ink-strong:#0B1626;--muted:#566374;--faint:#8592A2;
  --line:#D5DAE1;--line-soft:#E6E9EE;--line-strong:#B5BEC9;
  --navy:#0B1E33;--navy-2:#122A44;--navy-3:#1A3654;--on-navy:#F5F7FA;--on-navy-muted:#AAB8C8;--on-navy-faint:#6F8199;
  --accent:#1B4F8A;--accent-hover:#153E6D;--accent-soft:#E6EEF8;--on-accent:#FFFFFF;
  --copper:#B5652B;--copper-soft:#F6EAE0;
  --pass:#1E6B45;--pass-soft:#E2F1E8;--check:#8A5A0B;--check-soft:#FBF1DA;--stop:#A8261F;--stop-soft:#F9E5E3;
  --shadow:0 1px 2px rgba(11,22,38,.05),0 10px 28px -20px rgba(11,22,38,.30);
  --r:2px;--r-lg:4px;
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --gutter:clamp(16px,3vw,32px);--max:1240px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"kern","liga","calt"}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:600;color:var(--ink-strong);margin:0;text-wrap:balance}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:var(--mono)}
.label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.utility{background:var(--navy);color:var(--on-navy-muted);font-size:12px}
.utility .wrap{display:flex;gap:18px;align-items:center;height:34px}
.utility .demo{background:var(--copper);color:#fff;font-weight:600;letter-spacing:.12em;padding:2px 8px;border-radius:var(--r);font-size:10.5px}
.utility .sp{flex:1}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink-strong)}
.brand b{font-size:16px;letter-spacing:.10em;text-transform:uppercase;font-weight:700}
.brand b em{font-style:normal;font-weight:400;color:var(--muted)}
.brand .tg{font-size:12.5px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
@media(max-width:900px){.brand .tg{display:none}}
.actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-strong);border-radius:var(--r);padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ink{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{background:var(--navy);color:var(--on-navy);padding:34px 0 30px;position:relative;overflow:hidden;border-bottom:1px solid var(--copper)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(#000,transparent)}
.hero .wrap{position:relative}
.crumb{font-size:12.5px;color:var(--on-navy-muted);margin-bottom:14px}
.crumb a{color:var(--on-navy-muted);text-decoration:none}.crumb a:hover{color:#fff}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--copper)}
.eyebrow:before{content:"";width:18px;height:1px;background:currentColor}
.hero h1{color:#fff;font-size:clamp(26px,3.2vw,40px);line-height:1.08;letter-spacing:-.022em;margin:10px 0 10px}
.hero p{color:var(--on-navy-muted);max-width:70ch;margin:0;font-size:16px}
.hero .src{font-size:12.5px;color:var(--on-navy-faint);margin-top:10px}
main.desk{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start;padding-top:24px;padding-bottom:48px}
@media(max-width:960px){main.desk{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.step{padding:18px 20px;margin-bottom:12px}
.step header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.num{width:30px;height:30px;background:var(--navy);color:#fff;font:600 12px var(--mono);display:grid;place-items:center;border-radius:var(--r);flex:none}
.step.done .num{background:var(--pass)}
.step h3{font-size:16px}
.step header .st{margin-left:auto}
.step .help{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.opt{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 12px 10px;cursor:pointer;line-height:1.3;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-weight:600;font-size:14px;color:var(--ink-strong);padding-right:42px}
.opt .c{position:absolute;top:9px;right:10px;font:500 11px var(--mono);color:var(--faint)}
.opt.on .c{color:var(--accent)}
.opt .n{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.opt:disabled{cursor:not-allowed;background:var(--surface-2);border-style:dashed;border-color:var(--line)}
.opt:disabled b{color:var(--faint)}
.opt:disabled .why{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;font-style:italic}
.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r);background:var(--surface-2);color:var(--muted)}
.pill.pass{background:var(--pass-soft);color:var(--pass)}.pill.check{background:var(--check-soft);color:var(--check)}.pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill.req{background:var(--copper-soft);color:var(--copper)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.fields .in{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);height:40px;padding:0 10px}
.fields .in:focus-within{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.fields input{border:0;outline:0;background:transparent;width:100%;font-family:var(--mono);font-size:14px;color:var(--ink-strong)}
.fields .in i{font-style:normal;color:var(--faint);font-size:12.5px;font-family:var(--mono)}
aside.result{position:sticky;top:80px;display:flex;flex-direction:column;gap:12px}
@media(max-width:960px){aside.result{position:static}}
.pic{background:#fff;aspect-ratio:4/3;display:grid;place-items:center;border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.pic img{max-width:100%;max-height:100%;object-fit:contain;padding:14px}
.pad{padding:16px 18px}
.plate{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 12px}
.seg{display:flex;flex-direction:column;align-items:center;min-width:34px}
.seg span{font:600 15px var(--mono);color:var(--ink-strong);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;letter-spacing:.02em;white-space:nowrap}
.seg.miss span{color:var(--copper);background:var(--copper-soft);border-color:transparent}
.seg small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:3px;white-space:nowrap}
.dash{font:600 15px var(--mono);color:var(--faint);padding-top:5px}
.code{font:600 17px var(--mono);color:var(--ink-strong);word-break:break-all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.chk:first-of-type{border-top:0}
.chk .s{grid-column:2;font-size:12px;color:var(--faint)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{background:var(--surface-2);font:600 12px var(--mono);color:var(--muted);text-align:left;padding:6px 8px;white-space:nowrap}
.tbl td{padding:6px 8px;border-top:1px solid var(--line-soft);font-family:var(--mono);white-space:nowrap;color:var(--ink-strong)}
.src{font-size:12px;color:var(--faint);margin-top:6px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--copper);background:var(--copper-soft);padding:8px 10px;border-radius:0 var(--r) var(--r) 0}
.miss-list{font-size:13px;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r-lg);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{background:var(--navy);color:var(--on-navy-muted);border-top:1px solid var(--copper);font-size:12.5px;padding:22px 0}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
footer b{color:#fff;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* printable sheets */
#sheet{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.printing>*:not(#sheet){display:none!important}
  body.printing #sheet{display:block}
  body{background:#fff;color:#111}
}
#sheet{font:10pt/1.4 var(--font);color:#111}
#sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0B1E33;padding-bottom:6px;margin-bottom:10px}
#sheet .sh-head h1{font-size:16pt;color:#0B1E33}
#sheet .sh-head .meta{text-align:right;font:8.5pt var(--mono);color:#444}
#sheet .wm{position:fixed;top:42%;left:0;right:0;text-align:center;font:700 64pt var(--font);color:rgba(181,101,43,.10);transform:rotate(-24deg);letter-spacing:.1em;pointer-events:none}
#sheet h2{font-size:10.5pt;text-transform:uppercase;letter-spacing:.12em;color:#0B1E33;border-bottom:1px solid #B5652B;padding-bottom:2px;margin:12px 0 6px}
#sheet table{border-collapse:collapse;width:100%}
#sheet td,#sheet th{border:1px solid #c9ced6;padding:3px 6px;text-align:left;vertical-align:top;font-size:9pt}
#sheet th{background:#EDEFF2;font-weight:600}
#sheet .kv th{width:34%}
#sheet .code{font:700 13pt var(--mono);color:#0B1E33}
#sheet .foot{margin-top:14px;border-top:1px solid #c9ced6;padding-top:6px;font-size:8pt;color:#555}
#sheet .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
#sheet .sign div{border:1px solid #c9ced6;height:56px;padding:4px 6px;font-size:8pt;color:#555}
#sheet.landscape{}

/* site edition: light theme, site orange as the action colour */
:root{--accent:#e8620a;--accent-hover:#c4520a;--accent-soft:#fdeee3;--on-accent:#fff;--copper:#b4500a;--copper-soft:#fdf1e7;--navy:#3a4654}
.hero{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.hero:before{display:none}
.hero h1{color:var(--ink-strong)}.hero p{color:var(--muted)}.hero .src{color:var(--faint)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs [aria-current="page"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
footer{background:var(--surface);color:var(--muted);border-top:1px solid var(--line)}footer b{color:var(--ink-strong)}
.toast{background:#3a4654}
</style>
</head>

<header class="topbar"><div class="wrap">
  <nav class="tabs" aria-label="Configurator"><button type="button" class="btn sm" data-m="sanitary-ball">Automated ball valve, 3-piece</button><button type="button" class="btn sm" data-m="angle-seat">Pneumatic angle seat valve</button></nav>
  <div class="actions"><button class="btn sm" id="reset">Reset</button></div>
</div></header>
<section class="hero"><div class="wrap">

  <p id="desc"></p>
  <div class="src" id="hsrc"></div>
</div></section>

        <div class="plate" id="plate"></div>

        <div class="miss-list" id="missing"></div>

    <div class="card pad">

        <label>Quantity<span class="in"><input id="qty" type="number" min="1" value="1"><i>pcs</i></span></label>
        <label>Tag / project<span class="in"><input id="tag" type="text" placeholder="optional"></span></label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="ds">Datasheet PDF</button><button class="btn" id="crfq">Copy RFQ summary</button>
        <button class="btn primary" id="rfq" style="flex:1">Request quotation</button>
      </div>
      <div class="src" id="rfqNote"></div>
    </div>
  </aside>
</main>

META.images = META.images[MID];
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=o=>o==null?"":typeof o==="string"?o:(o.en||Object.values(o)[0]);
const byId=Object.fromEntries(M.steps.map(s=>[s.id,s]));
const st={sel:{},inp:Object.fromEntries((M.inputs||[]).map(i=>[i.id,i.default]))};

/* ---------- engine: gates, compatibility with reasons, auto-select, drop invalid ---------- */
function applies(s,sel){return !s.applies||Object.entries(s.applies).every(([k,v])=>sel[k]!=null&&v.includes(sel[k]));}
function fails(cl,sel){return Object.entries(cl).filter(([k,v])=>sel[k]!=null&&!v.includes(sel[k])).map(([k])=>k);}
function allowed(o,sel){return !o.when||o.when.some(cl=>fails(cl,sel).length===0);}
function optLabel(stepId,code){const o=byId[stepId].options.find(x=>x.code===code);return o?L(o.label):code;}
function reason(o,sel){
  let best=null;for(const cl of o.when){const f=fails(cl,sel);if(!best||f.length<best.length)best=f;}
  return best&&best.length?"Not available with "+best.map(k=>L(byId[k].label).toLowerCase()+" "+optLabel(k,sel[k])).join(" + "):"";
}
function normalize(){
  for(let pass=0;pass<12;pass++){let ch=false;
    for(const s of M.steps){
      if(!applies(s,st.sel)){if(st.sel[s.id]!=null){delete st.sel[s.id];ch=true;}continue;}
      const ok=s.options.filter(o=>allowed(o,st.sel));
      if(st.sel[s.id]!=null&&!ok.some(o=>o.code===st.sel[s.id])){delete st.sel[s.id];ch=true;}
      if(s.auto&&st.sel[s.id]==null&&ok.length===1){st.sel[s.id]=ok[0].code;ch=true;}
    }
    if(!ch)break;}
}
const visible=()=>M.steps.filter(s=>applies(s,st.sel));
const missing=()=>visible().filter(s=>!s.optional&&st.sel[s.id]==null);
function codeOut(s){const o=s.options.find(x=>x.code===st.sel[s.id]);return o?String(o.code_out??o.code).replace(/^-/,""):null;}
function segments(){
  const out=[];
  for(const g of M.segments){
    if(g.fixed){out.push({v:g.fixed,tag:g.tag,ok:true});continue;}
    let parts=[],any=false,miss=false;
    for(const k of g.steps){const s=byId[k];if(!applies(s,st.sel))continue;any=true;
      const v=codeOut(s);if(v==null){if(!s.optional){miss=true;parts.push("__");}}else if(v!=="")parts.push(v);}
    if(!any||(!parts.length))continue;
    out.push({v:(g.prefix&&!miss?g.prefix:"")+parts.join(g.join||""),tag:g.tag,ok:!miss});
  }
  return out;
}
const codeString=()=>segments().map(x=>x.v).join("-");
function dimsRow(){return (M.dims||[]).find(d=>Object.entries(d.when).every(([k,v])=>st.sel[k]===v));}
function lookup(){
  for(const lk of (M.lookups||[])){
    if(!lk.keys.every(k=>st.sel[k]!=null))continue;
    const v=lk.values[lk.keys.map(k=>st.sel[k]).join("|")];
    if(v)return {label:L(lk.label),value:v};
  }
  return null;
}
function checks(){
  const rows=[];
  for(const c of (M.checks||[])){
    const inp=(M.inputs||[]).find(i=>i.id===c.input);const raw=st.inp[c.input];const v=parseFloat(raw);
    if(raw===""||isNaN(v)){rows.push({k:"check",t:L(c.what)+" — enter "+L(inp.label).toLowerCase(),s:c.source});continue;}
    const ok=v>=c.min&&v<=c.max;
    rows.push({k:ok?"pass":"stop",t:ok?L(c.what):L(c.what)+" — entered "+v+" "+inp.unit+": outside catalogue limits",s:c.source});
  }
  const d=dimsRow();
  if(d){const ai=d.cols.findIndex(c=>/actuator/i.test(c));
    rows.push({k:"pass",t:ai>=0?"Actuator "+d.row[ai]+" and dimensions taken from the KST size table for this DN":"Dimensions taken from the KST size table for this DN",s:M.dims_source});}
  for(const r of (M.rules||[]))if(Object.entries(r.when).every(([k,v])=>v.includes(st.sel[k])))rows.push({k:"check",t:L(r.message),s:r.source||""});
  if(!missing().length)rows.push({k:"check",t:"Confirm with the manufacturer the documentation required for the application",s:""});
  return rows;
}
function pic(){const m=(META.images||[]).find(x=>Object.entries(x.when||{}).every(([k,v])=>v.includes(st.sel[k])));return m?m.src:META.images[META.images.length-1].src;}

/* ---------- render ---------- */
function render(){
  normalize();
  const sel=st.sel;
  let n=0;
  const inputs=(M.inputs||[]).length?`<section class="card step done"><header><span class="num">${String(++n).padStart(2,"0")}</span><h3>Process conditions</h3><span class="st pill">for the checks</span></header>
    <div class="fields">${M.inputs.map(i=>`<label>${esc(L(i.label))}<span class="in"><input data-inp="${i.id}" type="number" step="any" value="${esc(st.inp[i.id])}"><i>${esc(i.unit)}</i></span></label>`).join("")}</div></section>`:"";
  const steps=visible().map(s=>{
    const done=sel[s.id]!=null;
    const opts=s.options.filter(o=>!s.auto||allowed(o,sel)).map(o=>{const ok=allowed(o,sel);const on=sel[s.id]===o.code;const co=String(o.code_out??o.code).replace(/^-/,"");
      return `<button class="opt ${on?"on":""}" data-s="${s.id}" data-v="${esc(o.code)}" ${ok?"":"disabled"} ${ok?"":`title="${esc(reason(o,sel))}"`}>
        ${co?`<span class="c">${esc(co)}</span>`:""}<b>${esc(L(o.label))}</b>${o.note?`<span class="n">${esc(L(o.note))}</span>`:""}${ok?"":`<span class="why">${esc(reason(o,sel))}</span>`}</button>`;}).join("");
    return `<section class="card step ${done?"done":""}"><header><span class="num">${String(++n).padStart(2,"0")}</span><h3>${esc(L(s.label))}</h3>
      <span class="st">${done?`<span class="pill pass">${esc(optLabel(s.id,sel[s.id]))}</span>`:s.optional?`<span class="pill">optional</span>`:`<span class="pill req">required</span>`}</span></header>
      ${s.help?`<p class="help">${esc(L(s.help))}</p>`:""}<div class="opts">${opts}</div></section>`;
  }).join("");
  $("#steps").innerHTML=inputs+steps+((M.info||[]).length?`<p class="note">${M.info.map(i=>esc(L(i))).join("<br>")}</p>`:"");
  const segs=segments();
  $("#plate").innerHTML=segs.map((g,i)=>(i?`<span class="dash">-</span>`:"")+`<span class="seg ${g.ok?"":"miss"}"><span>${esc(g.v)}</span><small>${esc(g.tag)}</small></span>`).join("");
  const miss=missing();
  $("#status").innerHTML=miss.length?`<span class="pill req">${miss.length} step${miss.length>1?"s":""} open</span>`:`<span class="pill pass">complete</span>`;
  $("#missing").textContent=miss.length?"Open: "+miss.map(s=>L(s.label)).join(" · "):"";
  $("#codeNote").textContent=miss.length?"":"Reference code — KST confirms its article code in the offer";
  ["copy","ds","crfq","rfq"].forEach(id=>$("#"+id).disabled=!!miss.length);
  $("#rfqNote").textContent=miss.length?"Complete the open steps to enable datasheet and request.":"The request opens your e-mail client with the full configuration.";
  $("#checks").innerHTML=checks().map(r=>`<div class="chk"><span class="pill ${r.k}">${r.k}</span><span>${esc(r.t)}</span>${r.s?`<span class="s">Source: ${esc(r.s)}</span>`:""}</div>`).join("");
  const d=dimsRow();
  $("#dimsCard").hidden=!d;
  if(d){$("#dims").innerHTML=`<thead><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody><tr>${d.row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr></tbody>`;$("#dimsSrc").textContent="Source: "+M.dims_source;}
  const lk=lookup();$("#perfCard").hidden=!lk;if(lk){$("#perfLabel").textContent=lk.label;$("#perf").textContent=lk.value;}
  const p=pic();if($("#pic").getAttribute("src")!==p)$("#pic").src=p;
  document.querySelectorAll(".opt[data-s]").forEach(b=>b.onclick=()=>{const k=b.dataset.s,v=b.dataset.v;
    if(st.sel[k]===v&&byId[k].optional)delete st.sel[k];else st.sel[k]=v;render();});
  document.querySelectorAll("[data-inp]").forEach(i=>i.oninput=()=>{st.inp[i.dataset.inp]=i.value;
    $("#checks").innerHTML=checks().map(r=>`<div class="chk"><span class="pill ${r.k}">${r.k}</span><span>${esc(r.t)}</span>${r.s?`<span class="s">Source: ${esc(r.s)}</span>`:""}</div>`).join("");});
}

/* ---------- outputs ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200);}
function copy(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
  const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();return Promise.resolve();
}
const today=()=>new Date().toISOString().slice(0,10);
const docNo=kind=>"KST-"+kind+"-"+today().replace(/-/g,"").slice(2)+"-"+String(Date.now()).slice(-4);
function configRows(){return visible().filter(s=>st.sel[s.id]!=null).map(s=>[L(s.label),optLabel(s.id,st.sel[s.id])]);}
function head(title,no){return `<div class="wm">INDICATIVE</div><div class="sh-head"><div><div style="font:600 8pt var(--mono);letter-spacing:.14em;color:#B5652B">${esc(META.company.toUpperCase())} · PREVIEW</div><h1>${esc(title)}</h1></div>
  <div class="meta">Doc. ${esc(no)}<br>Date ${today()} · Rev. 0<br>Qty ${esc($("#qty").value||1)}${$("#tag").value?` · Tag ${esc($("#tag").value)}`:""}</div></div>`;}
function foot(){return `<div class="foot">Indicative document generated by the configurator preview from KST Automation Group catalogues (Sept 2026 edition). Not binding: technical data and materials are confirmed by the manufacturer. ${esc(META.company)} · ${esc(META.email)}</div>`;}
function printSheet(html,fileTitle,landscape){
  const sh=$("#sheet");sh.innerHTML=html;
  let style=document.getElementById("pg");if(!style){style=document.createElement("style");style.id="pg";document.head.appendChild(style);}
  style.textContent=landscape?"@media print{@page{size:A4 landscape;margin:10mm}}":"";
  const old=document.title;document.title=fileTitle;document.body.classList.add("printing");
  setTimeout(()=>{window.print();document.body.classList.remove("printing");document.title=old;},50);
}
function datasheet(){
  const code=codeString(),d=dimsRow(),lk=lookup();
  const html=head("Technical datasheet — "+L(M.label),docNo("DS"))+
   `<table class="kv"><tr><th>Configuration code</th><td class="code">${esc(code)}</td></tr><tr><th>Product</th><td>${esc(L(M.label))} — KST Automation Group</td></tr>
    <tr><th>Country of origin</th><td>People's Republic of China</td></tr></table>
   <h2>Configuration</h2><table class="kv">${configRows().map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table>
   <h2>Process conditions and checks</h2><table class="kv">${(M.inputs||[]).map(i=>`<tr><th>${esc(L(i.label))}</th><td>${esc(st.inp[i.id])} ${esc(i.unit)}</td></tr>`).join("")}</table>
   <table style="margin-top:6px"><tr><th style="width:12%">Result</th><th>Check</th><th style="width:34%">Source</th></tr>${checks().map(r=>`<tr><td>${r.k.toUpperCase()}</td><td>${esc(r.t)}</td><td>${esc(r.s)}</td></tr>`).join("")}</table>
   <h2>Ratings</h2><table class="kv">${(M.info||[]).map(i=>`<tr><td colspan="2">${esc(L(i))}</td></tr>`).join("")}</table>
   ${d?`<h2>Dimensions (mm)</h2><table><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr><tr>${d.row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr></table><div style="font-size:8pt;color:#555;margin-top:3px">Source: ${esc(M.dims_source)}</div>`:""}
   ${lk?`<h2>${esc(lk.label)}</h2><table class="kv"><tr><th>At selected supply</th><td>${esc(lk.value)}</td></tr></table>`:""}`+foot();
  printSheet(html,"KST_Datasheet_"+code,false);
}
function rfqText(){
  const code=codeString();
  return [`Request for quotation — ${L(M.label)}`,"",`Configuration code: ${code}`,`Quantity: ${$("#qty").value||1}`,$("#tag").value?`Tag / project: ${$("#tag").value}`:"","",
    ...configRows().map(([k,v])=>`${k}: ${v}`),"",...(M.inputs||[]).map(i=>`${L(i.label)}: ${st.inp[i.id]} ${i.unit}`),"","Company:","Country:","Required delivery:"].filter((x,i,a)=>x!==""||a[i-1]!=="").join("\n");
}
function rfq(){
  const code=codeString(),body=rfqText();
  const url=`mailto:${META.email}?subject=${encodeURIComponent("RFQ KST "+code)}&body=${encodeURIComponent(body)}`;
  if(url.length>1900){copy(body).then(()=>{toast("Request copied to the clipboard — paste it into an e-mail to "+META.email);});location.href=`mailto:${META.email}?subject=${encodeURIComponent("RFQ KST "+code)}`;}
  else location.href=url;
}
$("#copy").onclick=()=>copy(codeString()).then(()=>toast("Code copied"));
$("#ds").onclick=datasheet;$("#rfq").onclick=rfq;
$("#crfq").onclick=()=>copy(rfqText()).then(()=>toast("RFQ summary copied"));
$("#reset").onclick=()=>{st.sel={};st.inp=Object.fromEntries((M.inputs||[]).map(i=>[i.id,i.default]));render();window.scrollTo(0,0);};
$("#title").textContent=L(M.label);$("#crumb").textContent=L(M.label);$("#desc").textContent=L(M.description);
$("#hsrc").textContent="Data: "+M.dims_source+" · all options are limited to combinations listed in the KST tables";
/* preset from the link, e.g. #dn=50&conn=K&act=DA — shareable configurations */
new URLSearchParams(location.hash.slice(1)).forEach((v,k)=>{if(byId[k])st.sel[k]=v;else if(k in st.inp)st.inp[k]=v;});
document.querySelectorAll('.tabs [data-m]').forEach(b=>{if(b.dataset.m===MID)b.setAttribute('aria-current','page');b.onclick=()=>{location.search='?m='+b.dataset.m;};});
render();
window.addEventListener("hashchange",()=>{st.sel={};new URLSearchParams(location.hash.slice(1)).forEach((v,k)=>{if(byId[k])st.sel[k]=v;else if(k in st.inp)st.inp[k]=v;});render();});
})();
</script>
</body>
</html>
